<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <h1 class="text-primary text-center">Hello Bootstrap!</h1>

    <div class="container bg-light text-black p-3">
            Fixed width container
        </div>

    <div class="container-fluid bg-warning text-white p-3">
        Full width container    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </script>

    <div class="container">
        <div class="row">
            <div class="col-md-4 bg-secondary text-white p-3">Column 1</div>
            <div class="col-md-4 bg-dark text-white p-3">Column 2</div>
            <div class="col-md-4 bg-secondary text-white p-3">Column 3</div>
        </div>
            <div class="col-md-6 bg-info text-white p-3">Column 4</div>
            <div class="col-md-6 bg-primary text-white p-3">Column 5</div>
    </div>
    <div class="row">
        <div class="col-md-4 bg-warning text-black p-3">2:50 - 4:30</div>
        <div class="col-md-4 bg-danger text-white p-3">Web Desisigning</div>
    </div>
</body>
</html>
